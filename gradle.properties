# Gradle Properties
org.gradle.jvmargs = -Xmx6G

# Mapping Properties
mapping_channel = stable
mapping_version = 39

# Run Configurations
minecraft_username = Developer

# Mod Information
# group of the build: the other builds depend on io.github.xponer2:<rootProject.name> (settings.gradle)
maven_group = io.github.xponer2
mod_version = 1.0.0-dev
root_package = io.github.xponer2.translator
mod_id = translator
mod_name = Translator
archives_name = translator-1.12.2

mod_description = The Minecraft 1.21.1 / NeoForge API on Minecraft 1.12.2 Forge, for ports of modern mods. Has no content of its own.
mod_url = https://github.com/Xponer2/translator
mod_update_json =
# Delimit authors with commas
mod_authors = Xponer2
mod_credits = Bundles DataFixerUpper (MIT, Microsoft).
mod_logo_path =

# Class generated at build time with VERSION, MOD_ID and MOD_NAME
tag_class_name = io.github.xponer2.translator.TranslatorBuild
