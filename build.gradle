plugins {
    id 'net.neoforged.moddev' version '2.0.107' apply false
}

// the loader's own jars (FML, event bus, SPI) beside the joined game jar: the ladder's model of each version needs them
subprojects {
    tasks.register('printLoaderJars') {
        def files = project.provider { project.configurations.findByName('compileClasspath')?.files ?: [] }
        def out = project.file('loader-jars.txt')
        doLast {
            // the loader's jars, and Mojang's libraries whose API changes between the versions (DFU, Brigadier)
            out.text = files.get().findAll { def u = it.toURI().toString(); u.contains('/net.neoforged') || u.contains('/datafixerupper/') || u.contains('/brigadier/') }
                    .collect { it.absolutePath }.join('\n')
        }
    }
}

// libraries the converter itself uses (not the game's): Sinytra Adapter's dynamic mixin patches (MIT) and what it needs.
// `./gradlew :printToolJars` lists them in tools/tool-jars.txt (per machine); tools/libs.sh puts them on the tools' class path.
configurations {
    // ASM comes from the tools' own class path (tools/libs.sh, a newer ASM)
    ladderTools {
        exclude group: 'org.ow2.asm'
    }
}
repositories {
    maven { url 'https://maven.su5ed.dev/releases' }
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://libraries.minecraft.net' }
    mavenCentral()
}
dependencies {
    ladderTools 'org.sinytra.adapter:core:2.0.43+1.21.1'
    // the game's own libraries Adapter takes for granted
    ladderTools 'it.unimi.dsi:fastutil:8.5.12'
}
tasks.register('printToolJars') {
    def files = configurations.ladderTools
    def out = file('tools/tool-jars.txt')
    doLast {
        out.text = files.files.collect { it.absolutePath }.join('\n')
    }
}
