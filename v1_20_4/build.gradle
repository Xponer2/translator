plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
// Java 21: the converted 1.21.1 mods keep their class file version (65); 1.20.4 itself runs on it
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '20.4.253'
    // the behaviour probe mod of this project (src/main)
    mods {
        ladder_probe {
            sourceSet sourceSets.main
        }
    }
    runs {
        // the converted mods in run-<name>/mods; a headless server first (stopped by the test when it has started)
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
            jvmArgument '-Xmx4G'
            jvmArgument '-Dforge.logging.console.level=debug'
            jvmArgument '-Dforge.logging.marker.scan=ACCEPT'
            // the classes as the mods' mixins left them, in run-server/.mixin.out: proof that a mixin applied
            jvmArgument '-Dmixin.debug.export=true'
            // the behaviour probes (LadderProbe): results to this file, then the server stops
            systemProperty 'ladder.probe.out', file('run-server/probe.json').absolutePath.replace(File.separator, '/')
            // the converted mods' facts (LadderFacts), compared with the 1.21.1 reference
            systemProperty 'ladder.facts.out', file('run-server/facts.json').absolutePath.replace(File.separator, '/')
            systemProperty 'ladder.data.out', file('run-server/data.json').absolutePath.replace(File.separator, '/')
            // the test mods' own results (testmods/*): compared with their runs on their own version
            systemProperty 'ladder.test.out', file('run-server/test-a.json').absolutePath.replace(File.separator, '/')
            systemProperty 'ladder.test.b.out', file('run-server/test-b.json').absolutePath.replace(File.separator, '/')
            systemProperty 'ladder.test.e.out', file('run-server/test-e.json').absolutePath.replace(File.separator, '/')
            systemProperty 'ladder.test.d.out', file('run-server/test-d.json').absolutePath.replace(File.separator, '/')
        }
        client {
            client()
            gameDirectory = file('run-client')
            jvmArgument '-Xmx4G'
            jvmArgument '-Dforge.logging.marker.scan=ACCEPT'
            // the client probe (LadderProbeClient): results to this file at the title screen, then the game closes
            systemProperty 'ladder.probe.client.out', file('run-client/probe-client.json').absolutePath.replace(File.separator, '/')
            // the test mods' client results (testmods/*)
            systemProperty 'ladder.test.client.out', file('run-client/test-a-client.json').absolutePath.replace(File.separator, '/')
            systemProperty 'ladder.test.c.out', file('run-client/test-c.json').absolutePath.replace(File.separator, '/')
            systemProperty 'ladder.test.f.out', file('run-client/test-f.json').absolutePath.replace(File.separator, '/')
            // -Pladder.world: a fresh world is made and entered, the inventory opened, before the results
            systemProperty 'ladder.probe.client.world', project.hasProperty('ladder.world') ? 'true' : 'false'
            // -Pladder.connect=host:port: onto a dedicated server instead (serverNet), over a real connection
            systemProperty 'ladder.probe.client.connect', project.findProperty('ladder.connect') ?: ''
        }
        // a dedicated server that stays up (no probes) for a client over a real connection: run-server-net, port 25570
        serverNet {
            server()
            gameDirectory = file('run-server-net')
            programArgument '--nogui'
            jvmArgument '-Xmx3G'
        }
    }
}
configurations.configureEach {
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
}
