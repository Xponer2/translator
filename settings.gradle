pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
rootProject.name = 'translator-ladder'
// one subproject per Minecraft version of the ladder: only for the Mojang-named game + NeoForge jar of that version
include 'v1_21_1', 'v1_21', 'v1_20_6', 'v1_20_4', 'adapters_1_21', 'adapters_1_20_4', 'testmods:ladder_test_a', 'testmods:ladder_test_b', 'testmods:ladder_test_c', 'testmods:ladder_test_d', 'testmods:ladder_test_e', 'testmods:ladder_test_e_1204', 'testmods:ladder_test_f'
// 1.20.5: NeoForge only had betas without a development bundle; 1.20.6 is its hotfix, the rung 1.20.6 -> 1.20.4 holds its changes
