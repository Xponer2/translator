plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
// The hand-written adapters of the rung 1.21 -> 1.20.6: 1.21's newer API on 1.20.6 (NeoForge 20.6). Compiled against
// the real 1.20.6; a conversion further down converts this jar like any 1.20.6 mod (its rung's own package,
// ladder.rung1206, never clashes with another rung's adapters).
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
base { archivesName = 'ladder-adapters-1.20.6' }
version = '0.1.0'
neoForge {
    version = '20.6.144'
}
configurations.configureEach {
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// the code carried to 1.20.6 (made by LADDER_TO=1.20.6 tools/ladder.sh convert: ladder-carried-1.20.6.jar): the recipe inputs
def carried = rootProject.file(findProperty('ladder.carried1206') ?: 'out/converted-1.20.6/ladder-carried-1.20.6.jar')
dependencies {
    compileOnly files(carried)
}

// The calls of an @AddedTo template's static methods (shape patches copy them into a game class) become calls of the game
// class's: the adapters' bytecode makes the call 1.21 makes there (a mod's injection point), though javac only knows the
// template. ASM from Maven Central, loaded for this step alone.
repositories {
    mavenCentral()
}
configurations {
    addedToRewrite
}
dependencies {
    addedToRewrite 'org.ow2.asm:asm:9.8'
    addedToRewrite 'org.ow2.asm:asm-tree:9.8'
}
tasks.named('compileJava') {
    def asm = configurations.addedToRewrite
    doLast {
        def loader = new URLClassLoader(asm.files.collect { it.toURI().toURL() } as URL[], getClass().classLoader)
        def reader = loader.loadClass('org.objectweb.asm.ClassReader')
        def node = loader.loadClass('org.objectweb.asm.tree.ClassNode')
        def writer = loader.loadClass('org.objectweb.asm.ClassWriter')
        def classes = []
        destinationDirectory.get().asFile.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name.endsWith('.class')) classes << it }
        def parse = { File f ->
            def n = node.getConstructor().newInstance()
            reader.getConstructor(byte[]).newInstance([f.bytes] as Object[]).accept(n, 0)
            n
        }
        def added = [:]
        classes.each { f ->
            def n = parse(f)
            n.invisibleAnnotations?.each { a ->
                if (a.desc == 'Lladder/rung1206/shape/AddedTo;') {
                    added[n.name] = a.values[1]
                }
            }
        }
        if (added.isEmpty()) {
            return
        }
        classes.each { f ->
            def n = parse(f)
            if (added.containsKey(n.name)) {
                return
            }
            boolean changed = false
            n.methods.each { m ->
                m.instructions.each { insn ->
                    if (insn.getClass().simpleName == 'MethodInsnNode' && added.containsKey(insn.owner)) {
                        insn.owner = added[insn.owner]
                        insn.itf = false
                        changed = true
                    } else if (insn.getClass().simpleName == 'TypeInsnNode' && added.containsKey(insn.desc)) {
                        // (a cast to the template, for a call of an instance method an adapters' mixin adds to the class)
                        insn.desc = added[insn.desc]
                        changed = true
                    }
                }
            }
            if (changed) {
                def w = writer.getConstructor(int).newInstance(0)
                n.accept(w)
                f.bytes = w.toByteArray()
            }
        }
    }
}
