plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
// Test mod F, made for NeoForge 1.21.1: what NeoForge 21.1 added that the rung 1.21.1 -> 1.21 adapts (a menu provider's
// client data, dimension transition screens). Runs with test mod C in its client (natively on 1.21.1, converted on 1.21
// over a real connection); writes its results to -Dladder.test.f.out.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
base { archivesName = 'ladder-test-f-1.21.1' }
version = '1.0.0'
neoForge {
    version = '21.1.247'
    mods {
        ladder_test_f {
            sourceSet sourceSets.main
        }
    }
}
configurations.configureEach {
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
